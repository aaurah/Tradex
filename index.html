    <script>
      (function() {
        // Prevent crashes from read-only property assignment in WebKit/Safari or third-party web3 providers
        var isReadonlyErr = function(err) {
          if (!err) return false;
          var msg = typeof err === 'string' ? err : (err.message || String(err));
          return msg.indexOf('readonly property') !== -1 || msg.indexOf('read-only') !== -1;
        };

        window.addEventListener('error', function(event) {
          if (isReadonlyErr(event.message) || isReadonlyErr(event.error)) {
            console.warn('[Handled gracefully] Prevented readonly property error:', event.message || event.error);
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isReadonlyErr(event.reason)) {
            console.warn('[Handled gracefully] Prevented readonly property promise rejection:', event.reason);
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
